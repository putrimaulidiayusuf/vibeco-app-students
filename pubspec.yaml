name: vibeco_app
description: "ZieClean - School Cleanliness Management App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  geolocator: ^11.0.0
  image_picker: ^1.0.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.1.0
  provider: ^6.1.0
  intl: ^0.19.0
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#06241B"
  background_image: assets/images/splash_gradient_bg.png
  image: assets/images/native_splash_bg.png