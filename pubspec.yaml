name: vibeco_app
description: "VibeCo- School Cleanliness Management App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  camera: ^0.11.0
  image: ^4.1.3
  geolocator: ^11.0.0
  image_picker: ^1.0.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.1.0
  provider: ^6.1.0
  intl: ^0.19.0
  flutter_native_splash: ^2.4.8
  permission_handler: ^11.0.0
  flutter_onnxruntime: ^1.6.0
  video_player: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/vibecomodel.onnx
    - assets/maskot_video_animation.mp4

flutter_native_splash:
  color: "#06241B"